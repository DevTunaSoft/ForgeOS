[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "forgeos"
version = "0.1.0"
description = "Local-first autonomous software development manager starter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
secure-pytest = ["pytest>=9.0,<10"]
[project.scripts]
forgeos = "forgeos.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
