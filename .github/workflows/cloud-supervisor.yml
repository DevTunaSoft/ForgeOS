name: ForgeOS Cloud Supervisor (read-only)
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: forgeos-cloud-supervisor
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit task queue and active PRs
        run: python scripts/cloud_supervisor.py --output cloud-supervisor-report.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-supervisor-report
          path: cloud-supervisor-report.json
          if-no-files-found: warn
          retention-days: 7
