name: Handoff integrity
on:
  push:
    paths:
      - 'docs/**'
      - 'scripts/check_handoff.py'
      - 'scripts/handoff_snapshot.py'
      - 'scripts/audit_handoff_takeover.py'
      - 'tests/test_handoff_check.py'
      - 'tests/test_handoff_snapshot.py'
      - 'tests/test_handoff_takeover.py'
      - '.github/workflows/handoff-integrity.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check_handoff.py'
      - 'tests/test_handoff_check.py'
      - '.github/workflows/handoff-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: handoff-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_handoff_check.py' -v
      - name: Snapshot unit tests
        run: python -m unittest discover -s tests -p 'test_handoff_snapshot.py' -v
      - name: Snapshot smoke
        run: python scripts/handoff_snapshot.py
      - name: Takeover audit unit tests
        run: python -m unittest discover -s tests -p 'test_handoff_takeover.py' -v
      - name: Takeover readiness audit
        run: python scripts/audit_handoff_takeover.py
      - name: Handoff integrity
        run: python scripts/check_handoff.py --json
