name: Hosted link probe

# Does icacls /T follow a junction or a directory symlink inside a tree, with and
# without /L? Each case has one link type only. Runs on a GitHub-hosted Windows
# runner. Decoys live under the runner temp folder. Runs when this file changes on
# the designated branch. Logs are public: print no personal paths.

on:
  push:
    branches: [claude/exciting-bohr-wr08bs]
    paths:
      - ".github/workflows/hosted-link-probe.yml"

permissions:
  contents: read

jobs:
  link-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Probe icacls recursion through links
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $root = Join-Path $env:RUNNER_TEMP ('link-probe-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          New-Item -ItemType Directory -Path $root | Out-Null
          $sid = '*S-1-5-32-546'
          $cases = @(
            @{ name = 'junction-noL'; link = 'junction'; flags = @() },
            @{ name = 'junction-L'; link = 'junction'; flags = @('/L') },
            @{ name = 'symlink-noL'; link = 'symlink'; flags = @() },
            @{ name = 'symlink-L'; link = 'symlink'; flags = @('/L') }
          )
          foreach ($case in $cases) {
            $decoy = Join-Path $root ('decoy-' + $case.name)
            $snap = Join-Path $root ('snap-' + $case.name)
            New-Item -ItemType Directory -Path $decoy, $snap | Out-Null
            Set-Content -Path (Join-Path $decoy 'secret.txt') -Value 'decoy'
            $link = Join-Path $snap 'link'
            if ($case.link -eq 'junction') {
              cmd /c mklink /J $link $decoy | Out-Null
            } else {
              cmd /c mklink /D $link $decoy | Out-Null
            }
            $linkMade = Test-Path $link
            $before = (& icacls.exe $decoy | Out-String) + (& icacls.exe (Join-Path $decoy 'secret.txt') | Out-String)
            $grant = @($snap, '/grant:r', ($sid + ':(OI)(CI)R'), '/T', '/C') + $case.flags + @('/Q')
            & icacls.exe @grant | Out-Null
            $code = $LASTEXITCODE
            $after = (& icacls.exe $decoy | Out-String) + (& icacls.exe (Join-Path $decoy 'secret.txt') | Out-String)
            $guestsAdded = $after -match 'Guests'
            Write-Host "$($case.name): link made $linkMade; grant exit $code; decoy ACL changed: $($before -ne $after); Guests on decoy after: $guestsAdded"
            Compare-Object ($before -split "`r?`n") ($after -split "`r?`n") | ForEach-Object { Write-Host "  $($_.SideIndicator) $($_.InputObject)" }
            cmd /c rmdir $link | Out-Null
          }
          Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
