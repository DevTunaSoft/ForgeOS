name: PC Windows unit tests

# Runs the unit suite on the self-hosted Windows PC runner with the temporary folder
# set to the runner temp folder, which is outside the user profile. That is the
# condition that broke Windows labelling before PR #158.
# Runs when this file changes on the designated branch, or on manual dispatch with
# the ref input. Default ref: the PR #158 branch. Logs are public: print no personal paths.

on:
  push:
    branches: [claude/exciting-bohr-wr08bs]
    paths:
      - ".github/workflows/pc-windows-unit-tests.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to test
        required: false
        type: string

permissions:
  contents: read

jobs:
  pc-unit-tests:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    steps:
      - name: Check out the tested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'fix/windows-labelling-outside-profile' }}

      - name: Run the unit suite with temp outside the user profile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          $env:PYTHONPATH = Join-Path $PWD 'src'
          Write-Host "TEMP=$env:TEMP"
          py -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed with exit code $LASTEXITCODE" }
