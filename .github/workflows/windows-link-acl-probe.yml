name: Windows link ACL probe
run-name: Windows link ACL probe • ${{ github.ref_name }}
# Manual evidence run only. It never runs on push or pull_request.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
        target:
          - label: main-5107d46
            sha: 5107d467db96e7512f5d7126af745fb9c5c1bcdf
          - label: pr158-head-9581162
            sha: 9581162fb158e0c54b2e9e6ee510f811de3fd997
    steps:
      # The probe script comes from the dispatched branch. The code under test
      # comes from a fixed commit, so each target is measured by identical probe code.
      - name: Checkout probe tools (dispatched branch)
        uses: actions/checkout@v4
        with:
          path: probe
      - name: Checkout code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.sha }}
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record runner identity
        shell: pwsh
        run: |
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          Write-Host ("Windows: " + (Get-CimInstance Win32_OperatingSystem).Caption)
          whoami /groups | Select-String -Pattern 'Mandatory Level'
      - name: Run link-following and snapshot probe
        shell: pwsh
        run: python probe/tools/windows_link_acl_probe.py --src code/src --label "${{ matrix.target.label }}-py${{ matrix.python-version }}" --out "${{ runner.temp }}/link-acl-probe.json"
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-acl-probe-${{ matrix.target.label }}-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/link-acl-probe.json
          if-no-files-found: warn
          retention-days: 14
