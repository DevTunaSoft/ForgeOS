name: Windows EXE acceptance
run-name: Windows EXE acceptance - ${{ github.ref_name }}

# Hosted Windows acceptance of a packaged ForgeOS.exe, run from this branch.
#
# Each matrix job builds ForgeOS.exe from its code under test, runs the EXE's
# frozen acceptance modes, then drives the same EXE through add -> plan -> run
# with Ollama and qwen2.5-coder:3b against a disposable Python project.
# It runs on windows-latest, NOT on a physical PC.
#
# "main" is the control: main still has the 30-second planning socket timeout.
# "planning-fix" is the branch under review, with the 180-second deadline.
#
# The EXE is a test build: the product launcher plus a hidden --cli route
# (.github/scripts/acceptance_entry.py). It is built with --console so the CLI
# output is visible; the product build uses --windowed. Verdicts, transcripts
# and the EXE hash are committed to acceptance-results/windows-exe/ on this
# branch. The EXE itself is uploaded as a workflow artifact.

on:
  push:
    branches: [claude/exciting-bohr-wr08bs]
    paths:
      - ".github/workflows/windows-exe-acceptance.yml"
      - ".github/scripts/windows-exe-acceptance.ps1"
      - ".github/scripts/acceptance_entry.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  exe-acceptance:
    name: exe acceptance (${{ matrix.label }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main
            ref: main
          - label: planning-fix
            ref: fix/planning-socket-timeout-20261117
    steps:
      - name: Check out the harness from the designated branch
        uses: actions/checkout@v4
        with:
          path: ci-harness
          persist-credentials: false

      - name: Check out the code under test
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: under-test
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller and test extras
        working-directory: under-test
        run: python -m pip install --upgrade pip "pyinstaller>=6.0,<7" ".[secure-pytest]"

      - name: Build the acceptance EXE
        working-directory: under-test
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          python forgeos_build/write_build_info.py --sha $sha
          python -m PyInstaller --noconfirm --clean --onefile --console --name ForgeOS --paths src --paths . --add-data "docs/USER_GUIDE.md;forgeos" --add-data "forgeos_build/build_info.json;forgeos" "$env:GITHUB_WORKSPACE/ci-harness/.github/scripts/acceptance_entry.py"
          if (-not (Test-Path dist/ForgeOS.exe)) { throw "PyInstaller produced no dist/ForgeOS.exe" }
          Get-Item dist/ForgeOS.exe | Format-List Name, Length

      - name: Run the EXE through frozen checks, add, plan and run
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/ci-harness/.github/scripts/windows-exe-acceptance.ps1" `
            -Exe "$env:GITHUB_WORKSPACE/under-test/dist/ForgeOS.exe" `
            -UnderTest "$env:GITHUB_WORKSPACE/under-test" `
            -ResultsDir "$env:GITHUB_WORKSPACE/results" `
            -Label "${{ matrix.label }}" `
            -TestRef "${{ matrix.ref }}"

      - name: Record a verdict if the harness wrote no summary
        if: always()
        shell: pwsh
        run: |
          $dir = "$env:GITHUB_WORKSPACE/results"
          $path = "$dir/${{ matrix.label }}.json"
          if (-not (Test-Path $path)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $doc = [ordered]@{
              label          = "${{ matrix.label }}"
              verdict        = "NO_RESULT"
              test_ref       = "${{ matrix.ref }}"
              designated_sha = "${{ github.sha }}"
              run_id         = "${{ github.run_id }}"
              detail         = "the build or harness wrote no summary; see the job log"
            }
            $doc | ConvertTo-Json | Set-Content -Path $path -Encoding utf8
          }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.label }}
          path: results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the acceptance EXE
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.label }}
          path: under-test/dist/ForgeOS.exe
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: commit results
    needs: exe-acceptance
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the designated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download result files
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: incoming
          merge-multiple: true

      - name: Commit results to the designated branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dest=acceptance-results/windows-exe
          mkdir -p "$dest"
          shopt -s nullglob
          files=(incoming/*.json incoming/*.log)
          if [ ${#files[@]} -gt 0 ]; then cp -f "${files[@]}" "$dest"/; fi
          git add -f -- "$dest"
          if git diff --cached --quiet; then
            echo "No result files to commit."
            exit 0
          fi
          verdict() { jq -r '.verdict // "missing"' "$dest/$1.json" 2>/dev/null || echo missing; }
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "ci: record Windows EXE acceptance results [skip ci]" \
              -m "Run ${GITHUB_RUN_ID}: main=$(verdict main), planning-fix=$(verdict planning-fix)."
          git pull -q --no-rebase --no-edit origin "$BRANCH"
          git push -q origin "HEAD:refs/heads/$BRANCH"

  release:
    name: publish the passing test EXE
    needs: exe-acceptance
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the planning-fix results
        uses: actions/download-artifact@v4
        with:
          name: results-planning-fix
          path: results

      - name: Decide whether this run passed
        id: verdict
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          verdict=$(jq -r '.verdict // "missing"' results/planning-fix.json 2>/dev/null || echo missing)
          designated=$(jq -r '.designated_sha // ""' results/planning-fix.json 2>/dev/null || echo "")
          if [ "$verdict" = "PASS" ] && [ "$designated" = "$EXPECTED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "planning-fix passed for $EXPECTED_SHA; publishing"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "planning-fix verdict is $verdict for $designated; not publishing"
          fi

      - name: Download the planning-fix EXE
        if: steps.verdict.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: exe-planning-fix
          path: exe

      - name: Publish the pre-release
        if: steps.verdict.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe_sha=$(sha256sum exe/ForgeOS.exe | cut -d' ' -f1)
          under_sha=$(jq -r '.under_test_sha' results/planning-fix.json)
          cp exe/ForgeOS.exe ForgeOS-acceptance-planning-fix.exe
          cat > notes.md <<EOF
          Acceptance TEST build of ForgeOS (planning fix), built and checked by GitHub Actions.

          - Source under test: \`${under_sha}\` (branch \`fix/planning-socket-timeout-20261117\`)
          - ForgeOS.exe SHA-256: \`${exe_sha}\`
          - Result: PASS on a hosted Windows runner, run ${GITHUB_RUN_ID}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This is a test build, not a signed release. It is a console build with an extra hidden \`--cli\` route that the acceptance tests use.
          EOF
          gh release delete acceptance-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create acceptance-latest ForgeOS-acceptance-planning-fix.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Acceptance test build (planning fix)" --notes-file notes.md
