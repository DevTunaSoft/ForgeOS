name: ForgeOS foundation tests
on:
  push:
  pull_request:
concurrency:
  # Cancel superseded branch builds rather than consuming RAM and CI minutes
  # testing old commits. Pull-request and push events share this group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python compilation
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Memory capture benchmark (12 MiB x 3 cycles)
        run: python tools/memory_benchmark.py --mib 12 --cycles 3 --check
