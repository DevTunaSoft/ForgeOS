name: ForgeOS foundation tests
run-name: Foundation tests • ${{ github.event_name }} • ${{ github.head_ref || github.ref_name }}
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python compilation
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Memory capture benchmark (12 MiB x 3 cycles)
        run: python tools/memory_benchmark.py --mib 12 --cycles 3 --check
      - name: Browser observation bounded allocation and change-size benchmark
        run: python tools/browser_observation_benchmark.py --check
      - name: Windows browser acceptance CLI smoke (no external browser launched)
        run: python -m forgeos.browser_acceptance --help
