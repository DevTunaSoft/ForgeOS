name: ForgeOS foundation tests
run-name: Foundation tests • ${{ github.event_name }} • ${{ github.head_ref || github.ref_name }}
on:
  # Feature branches are already validated by pull_request. Restrict push
  # validation to main so one feature commit does not launch the same matrix
  # twice (push + pull_request).
  push:
    branches: [main]
  pull_request:
concurrency:
  # Cancel superseded builds rather than consuming RAM and CI minutes.
  # Feature branches have one PR-triggered matrix; main has one push matrix.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python compilation
        run: python -m compileall -q src tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Memory capture benchmark (12 MiB x 3 cycles)
        run: python tools/memory_benchmark.py --mib 12 --cycles 3 --check
