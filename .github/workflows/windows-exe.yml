name: Windows executable
run-name: Windows EXE • ${{ github.event_name }} • ${{ github.head_ref || github.ref_name }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # Cancel superseded branch builds rather than consuming RAM and CI minutes
  # testing old commits. Pull-request and push events share this group.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and PyInstaller
        run: python -m pip install --upgrade pip "pyinstaller>=6.0,<7" ".[secure-pytest]"
      - name: Validate Python sources
        run: python -m compileall -q src tests
      - name: Execute regression tests
        run: python -m unittest discover -s tests -v
      - name: Package GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ForgeOS --paths src --add-data "docs/USER_GUIDE.md;forgeos" forgeos_build/launcher.py
      - name: Check executable exists and is nonempty
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ForgeOS.exe")) { throw "Executable missing" }
          $size = (Get-Item "dist/ForgeOS.exe").Length
          if ($size -lt 1000000) { throw "Executable unexpectedly small: $size" }
          Write-Host "Packaged executable bytes: $size"
      - name: Headless frozen executable smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/ForgeOS.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen smoke test failed: $($process.ExitCode)" }
      - name: Frozen Tkinter GUI startup and cleanup acceptance
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'gui-acceptance-report.json'
          $args = '--gui-acceptance-report "' + $report + '"'
          $process = Start-Process -FilePath "$PWD/dist/ForgeOS.exe" -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $report) { Get-Content $report }
            throw 'Frozen GUI exceeded 90-second watchdog'
          }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Frozen GUI failed: $($process.ExitCode)" }
          if (!(Test-Path $report)) { throw 'Frozen GUI acceptance report missing' }
          $json = Get-Content -Raw $report | ConvertFrom-Json
          if (-not $json.gui_started -or -not $json.queue_initialized -or -not $json.closed_cleanly -or $json.ram_after_gui_startup_bytes -le 0 -or -not $json.paginated_history_ok -or -not $json.offline_user_guide_available -or $json.tasks_verified -ne 520 -or $json.rss_growth_during_paging_bytes -gt 67108864) {
            throw 'Frozen GUI initialization/cleanup was not verified'
          }
      - name: Frozen secure AppContainer boundary smoke test
        shell: pwsh
        run: |
          $report = "$PWD/secure-smoke-report.txt"
          $env:FORGEOS_SECURE_SMOKE_REPORT = $report
          $process = Start-Process -FilePath "$PWD/dist/ForgeOS.exe" -ArgumentList "--secure-sandbox-smoke" -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $report) { Get-Content $report }
            throw "Frozen secure AppContainer smoke exceeded 120-second outer watchdog"
          }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Frozen secure AppContainer smoke failed: $($process.ExitCode)" }
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ForgeOS-Windows-EXE
          path: dist/ForgeOS.exe
          if-no-files-found: error
          retention-days: 14
