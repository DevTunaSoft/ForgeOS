name: Windows executable
run-name: Windows EXE • ${{ github.event_name }} • ${{ github.head_ref || github.ref_name }}
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package-windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and PyInstaller
        run: python -m pip install --upgrade pip "pyinstaller>=6.0,<7" ".[secure-pytest]"
      - name: Validate Python sources
        run: python -m compileall -q src tests forgeos_build
      - name: Embed exact build source commit
        run: python forgeos_build/write_build_info.py --sha "${{ github.sha }}"
      # Full Linux/Windows Python 3.10/3.12 regression coverage belongs to
      # the separate required Foundation tests workflow. Do not run that
      # same suite again here; this workflow owns frozen-Windows packaging
      # and executable/security acceptance.
      - name: Package GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ForgeOS --paths src --add-data "docs/USER_GUIDE.md;forgeos" --add-data "forgeos_build/build_info.json;forgeos" forgeos_build/launcher.py
      - name: Check executable exists and is nonempty
        shell: pwsh
        run: |
          if (!(Test-Path "dist/ForgeOS.exe")) { throw "Executable missing" }
          $size = (Get-Item "dist/ForgeOS.exe").Length
          if ($size -lt 1000000) { throw "Executable unexpectedly small: $size" }
          Write-Host "Packaged executable bytes: $size"
      - name: Headless frozen executable smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$PWD/dist/ForgeOS.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen smoke test failed: $($process.ExitCode)" }
      - name: Frozen artifact-to-source acceptance identity
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'artifact-acceptance-report.json'
          $args = '--acceptance-snapshot-report "' + $report + '"'
          $process = Start-Process -FilePath "$PWD/dist/ForgeOS.exe" -ArgumentList $args -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen acceptance identity failed: $($process.ExitCode)" }
          if (!(Test-Path $report)) { throw "Frozen acceptance identity report missing" }
          $json = Get-Content -Raw $report | ConvertFrom-Json
          $expectedCommit = "${{ github.sha }}".ToLowerInvariant()
          $actualHash = (Get-FileHash -Algorithm SHA256 "$PWD/dist/ForgeOS.exe").Hash.ToLowerInvariant()
          if ($json.artifact.build_source_commit -ne $expectedCommit) {
            throw "Embedded source SHA mismatch: $($json.artifact.build_source_commit) != $expectedCommit"
          }
          if ($json.artifact.executable_sha256 -ne $actualHash) {
            throw "Executable SHA-256 mismatch"
          }
          if (-not $json.windows_host_evidence) {
            throw "Frozen report did not identify Windows host evidence"
          }
          if ($json.physical_windows_target_asserted) {
            throw "Hosted CI must never assert physical-target acceptance"
          }
          Write-Host "Verified source commit: $expectedCommit"
          Write-Host "Verified executable SHA-256: $actualHash"
      - name: Frozen Tkinter GUI startup and cleanup acceptance
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'gui-acceptance-report.json'
          $args = '--gui-acceptance-report "' + $report + '"'
          $process = Start-Process -FilePath "$PWD/dist/ForgeOS.exe" -ArgumentList $args -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $report) { Get-Content $report }
            throw 'Frozen GUI exceeded 90-second watchdog'
          }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Frozen GUI failed: $($process.ExitCode)" }
          if (!(Test-Path $report)) { throw 'Frozen GUI acceptance report missing' }
          $json = Get-Content -Raw $report | ConvertFrom-Json
          if (-not $json.gui_started -or -not $json.queue_initialized -or -not $json.closed_cleanly -or $json.ram_after_gui_startup_bytes -le 0 -or -not $json.paginated_history_ok -or -not $json.offline_user_guide_available -or $json.tasks_verified -ne 520 -or $json.rss_growth_during_paging_bytes -gt 67108864) {
            throw 'Frozen GUI initialization/cleanup was not verified'
          }
      - name: Frozen secure AppContainer boundary smoke test
        shell: pwsh
        run: |
          $report = "$PWD/secure-smoke-report.txt"
          $env:FORGEOS_SECURE_SMOKE_REPORT = $report
          $process = Start-Process -FilePath "$PWD/dist/ForgeOS.exe" -ArgumentList "--secure-sandbox-smoke" -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $report) { Get-Content $report }
            throw "Frozen secure AppContainer smoke exceeded 120-second outer watchdog"
          }
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0) { throw "Frozen secure AppContainer smoke failed: $($process.ExitCode)" }
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ForgeOS-Windows-EXE
          path: dist/ForgeOS.exe
          if-no-files-found: error
          retention-days: 14
